<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start · theugc.life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-chrome="public" data-page="signup" data-title="Start">
  <a class="skip" href="#contenido">Skip to content</a>
  <main id="contenido">
    <form class="auth-card stack" action="onboarding.html">
      <p class="kicker">Create your desk</p>
      <h1>Start with a name.</h1>
      <label class="field">Name<input required value="Maya Chen"></label>
      <label class="field">Email<input type="email" required value="maya@example.com"></label>
      <label class="field">Password<input type="password" required value="sample-pass"></label>
      <button class="btn btn-ball" type="submit">Continue</button>
      <p class="small">Next you’ll pick a destination and a hotel. That does not spend a credit, and it does not show the email. <span class="anno live">live</span></p>
    </form>
  </main>
  <script src="chrome.js"></script>
  <script src="proto.js"></script>
</body>
</html>
