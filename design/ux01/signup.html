<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — TheUGC.life</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { colors: { sun: '#FFE01B', ink: '#111111', paper: '#FAFAF8', muted: '#555555', border: '#E6E6E6' }, fontFamily: { sans: ['Archivo', 'sans-serif'] } } } }</script>
  <style>body { font-family: 'Archivo', sans-serif; }</style>
</head>
<body class="bg-paper text-ink min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <a href="index.html" class="flex items-center gap-2 font-semibold mb-8 justify-center">
      <div class="w-7 h-7 bg-sun rounded flex items-center justify-center text-xs font-bold">UGC</div>
      theugc.life
    </a>
    <h1 class="text-2xl font-bold mb-2 text-center">Create your account</h1>
    <p class="text-muted text-center mb-8">Free to start. 5 credits every week.</p>
    <form class="space-y-4" onsubmit="event.preventDefault(); window.location='onboarding.html'">
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" value="sofia@creator.example" class="w-full border border-border rounded px-3 py-2 bg-white" required>
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <input type="password" value="••••••••" class="w-full border border-border rounded px-3 py-2 bg-white" required>
      </div>
      <button type="submit" class="w-full bg-sun text-ink font-semibold py-3 rounded">Continue</button>
    </form>
    <p class="text-sm text-muted text-center mt-6">Already have an account? <a href="#" class="underline">Log in</a></p>
  </div>
</body>
</html>
