<script>
const icons={search:'<circle cx="10.5" cy="10.5" r="6.3"/><path d="m15.4 15.4 5 5"/>',map:'<path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16"/>',sliders:'<path d="M4 7h16M4 17h16M9 4v6m6 4v6"/>',bookmark:'<path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.8"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',check:'<path d="m4 12 5 5L20 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20.8 15.2A9 9 0 0 1 8.8 3.2 9 9 0 1 0 20.8 15.2z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',external:'<path d="M13 5h6v6M19 5l-9 9"/><path d="M19 13v6H5V5h6"/>',chevron:'<path d="m9 18 6-6-6-6"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',share:'<circle cx="6" cy="12" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5m-8 7 8 5"/>'};
const I=(name,size=16)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.info}</svg>`;
const hotels=[
{id:1,name:'Siam Riverside House',city:'Bangkok',country:'Thailand',district:'Riverside',type:'Boutique hotel',stars:5,signal:'High creator activity',collab:true,recency:'Past month',pos:[37,48],art:0,rate:'38%',reply:'1–3 days',fit:'Stay',confidence:'Strong',status:'not saved'},
{id:2,name:'The Quarter Design Hotel',city:'Bangkok',country:'Thailand',district:'Sukhumvit',type:'Design hotel',stars:5,signal:'Creator activity detected',collab:true,recency:'Past quarter',pos:[71,32],art:1,rate:'26%',reply:'3–7 days',fit:'Stay + paid',confidence:'Moderate',status:'saved'},
{id:3,name:'Atelier Silom Residence',city:'Bangkok',country:'Thailand',district:'Silom',type:'Boutique hotel',stars:4,signal:'Emerging creator activity',collab:false,recency:'Past quarter',pos:[52,64],art:2,rate:null,reply:null,fit:null,confidence:'Emerging',status:'not saved'},
{id:4,name:'Luma Garden Bangkok',city:'Bangkok',country:'Thailand',district:'Thonglor',type:'Hotel',stars:5,signal:null,collab:false,recency:null,pos:[80,53],art:3,rate:null,reply:null,fit:null,confidence:null,status:'not saved'},
{id:5,name:'North Palm Retreat',city:'Chiang Mai',country:'Thailand',district:'Old City',type:'Resort',stars:5,signal:'Creator activity detected',collab:false,recency:'Past quarter',pos:[22,27],art:4,rate:'21%',reply:'1–2 weeks',fit:null,confidence:'Moderate',status:'not saved'},
{id:6,name:'Blue Coast Pavilion',city:'Phuket',country:'Thailand',district:'Kata',type:'Resort',stars:5,signal:'High creator activity',collab:true,recency:'Past month',pos:[26,73],art:5,rate:'44%',reply:'Under 24h',fit:'Stay',confidence:'Strong',status:'not saved'}];
const state={view:'discover',plan:'free',theme:'light',selected:1,search:'',destination:'Bangkok',type:'',extra:false,stars:false,collab:false,sort:'name',saved:new Set([2]),unlocked:new Set(),credits:{free:5,pro:150,max:500},mobileMap:false,activeTab:'overview',showRank:false,showContact:false};
let timeout;
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(timeout);timeout=setTimeout(()=>t.classList.add('hide'),2900)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function art(id){let themes=[['#A5C9C3','#387F86','#DAE7CE','#275763'],['#D8CDB3','#8B9B8E','#A9C0C7','#526A69'],['#B6CDD2','#477C91','#DDC5A9','#546E80'],['#AFC3B9','#4C776C','#DDD7C6','#4C6A5A'],['#BFC9B3','#79967B','#E0D8B9','#48685C'],['#A2C8CE','#457E95','#E5D2BC','#3C6D74']];let c=themes[id%6];return `<svg class="art" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-label="Illustrative architecture placeholder"><defs><linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient><linearGradient id="pool${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${c[1]}"/><stop offset="1" stop-color="${c[3]}"/></linearGradient></defs><rect width="600" height="320" fill="url(#sky${id})"/><path d="M0 239 Q154 206 333 242 T600 240 V320 H0" fill="${c[1]}" opacity=".43"/><path d="M0 255h600v65H0" fill="url(#pool${id})"/><path d="M0 275h600" stroke="#DAEDEA" stroke-width="2" opacity=".45"/><path d="M95 93h372v141H95z" fill="${c[3]}"/><path d="M109 108h344v113H109z" fill="${c[2]}"/><path d="M109 103h344v12H109z" fill="${c[3]}"/><g fill="${c[1]}" opacity=".83"><rect x="132" y="132" width="53" height="80"/><rect x="205" y="132" width="53" height="80"/><rect x="279" y="132" width="53" height="80"/><rect x="354" y="132" width="72" height="80"/></g><g stroke="${c[2]}" stroke-width="5" opacity=".68"><path d="M155 132v80m74-80v80m77-80v80m87-80v80"/></g><path d="M73 230c2-53-15-74-41-91m41 91c-10-73 24-115 48-124m-48 124c-27-48-58-49-74-48" stroke="${c[3]}" stroke-width="9" fill="none" opacity=".7"/><path d="M500 229c-4-55 23-93 54-118m-54 118c20-45 48-48 77-48" stroke="${c[3]}" stroke-width="9" fill="none" opacity=".7"/><path d="M0 241h600" stroke="#FBF9EF" stroke-width="4" opacity=".6"/></svg>`}
function mapArt(){let h=`<svg class="mapart" viewBox="0 0 700 530" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="530" fill="var(--mapLand)"/><path fill="var(--mapPark)" d="M465 15h194v135H465zM25 300h152v131H25zM535 390h132v145H535z" opacity=".72"/><path d="M260-20C180 65 325 129 241 220S318 383 248 553" fill="none" stroke="var(--mapWater)" stroke-width="58"/><g fill="none" stroke="var(--mapRoad)" stroke-width="13" opacity=".93">`;for(let i=1;i<10;i++){let y=23+i*51;h+=`<path d="M-15 ${y} Q170 ${y-35} 365 ${y+19} T720 ${y-11}"/>`;}for(let i=0;i<9;i++){let x=i*88+18;h+=`<path d="M${x} -10 Q${x+45} 152 ${x-5} 286 T${x+30} 550"/>`;}h+=`</g><g fill="none" stroke="var(--mapRoad)" stroke-width="5">`;for(let i=0;i<8;i++){h+=`<path d="M${i*88-35} 530  ${i*100+145} 0"/>`;}h+=`</g><g fill="var(--sub)" font-family="Arial,sans-serif" font-size="12" opacity=".56"><text x="450" y="196">SUKHUMVIT</text><text x="382" y="365">SILOM</text><text x="80" y="127">RIVERSIDE</text><text x="480" y="465">SATHORN</text><text x="290" y="85">BANGKOK</text></g></svg>`;return h}
function filtered(){let a=hotels.filter(h=>{let q=state.search.toLowerCase().trim();return (!q||`${h.name} ${h.city} ${h.district}`.toLowerCase().includes(q))&&(!state.destination||h.city===state.destination)&&(!state.type||h.type.toLowerCase().includes(state.type.toLowerCase()))&&(!state.stars||h.stars===5)&&(!state.collab||h.collab)});if(state.sort==='activity')a.sort((x,y)=>Number(!!y.signal)-Number(!!x.signal));if(state.sort==='response'&&state.plan!=='free')a.sort((x,y)=>parseInt(y.rate||'0')-parseInt(x.rate||'0'));if(state.sort==='fastest'&&state.plan!=='free')a.sort((x,y)=>['Under 24h','1–3 days','3–7 days','1–2 weeks',null].indexOf(x.reply)-['Under 24h','1–3 days','3–7 days','1–2 weeks',null].indexOf(y.reply));return a}
function activeChips(){let arr=[];if(state.destination)arr.push(['destination',state.destination]);if(state.type)arr.push(['type',state.type]);if(state.stars)arr.push(['stars','5-star']);if(state.collab)arr.push(['collab','Observed collaboration']);return arr}
function hotelRow(h){let saved=state.saved.has(h.id);return `<article class="hotel-row" data-hover="${h.id}"><div class="thumb" role="img" aria-label="Illustrative hotel image, not a photograph of this property">${art(h.art)}<span class="photolabel">Visual placeholder</span></div><div class="hotel-copy"><a href="#hotel-${h.id}" class="hotel-title" data-open="${h.id}">${escapeHtml(h.name)}</a><div class="hotel-location">${escapeHtml(h.district)}, ${escapeHtml(h.city)} · ${escapeHtml(h.type)}</div><div class="hotel-property"><span class="stars">${'★'.repeat(h.stars)}</span><span>${h.stars}-star classification</span></div><div class="signal-line">${h.signal?`<span class="signal">${escapeHtml(h.signal)}</span>`:''}${h.collab?'<span class="signal neutral">Collaboration observed</span>':''}${saved?'<span class="signal private">In your pipeline</span>':''}</div></div><div class="row-actions"><button class="save ${saved?'active':''}" data-save="${h.id}" aria-label="${saved?'Remove':'Save'} ${escapeHtml(h.name)}">${I(saved?'check':'bookmark',13)} ${saved?'Saved':'Save'}</button><button class="text-btn rowlink" data-open="${h.id}">View hotel ${I('arrow',13)}</button></div></article>`}
function drawMap(a){let pins=a.map((h,i)=>`<button class="map-pin" data-map-open="${h.id}" data-map-hover="${h.id}" style="left:${h.pos[0]}%;top:${h.pos[1]}%" aria-label="View ${escapeHtml(h.name)}" title="${escapeHtml(h.name)}">${i+1}</button>`).join('');return `<aside class="mapwrap ${state.mobileMap?'mobile-active':''}" id="mapPanel"><div class="map-header"><strong>${state.destination||'Explore'} · Map</strong><span>${a.length} visible results</span></div><div class="mapbody">${mapArt()}${pins}<div class="map-popup hide" id="mapPopup"></div></div><div class="map-footer">${I('info',13)} Map pins represent displayed demo results only · illustrative geography</div></aside>`}
function discover(){let a=filtered();let chips=activeChips();return `<div class="headrow"><div><div class="eyebrow" style="margin-bottom:9px">FIND YOUR NEXT PARTNERSHIP</div><h1>Discover hotels<span style="color:#92AD3B">.</span></h1><p>Find the right places. Turn destinations into opportunities.</p></div><div class="headside">${I('check',15)} Worldwide hotel discovery</div></div><section class="filters" role="search"><label class="searchbox">${I('search',18)}<input id="searchInput" aria-label="Search hotels or destinations" placeholder="Search hotels or destinations" value="${escapeHtml(state.search)}" autocomplete="off"/></label><div class="selectwrap"><select class="control" id="destinationSelect" aria-label="Destination"><option value="">All destinations</option>${['Bangkok','Chiang Mai','Phuket'].map(x=>`<option ${state.destination===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="selectwrap"><select class="control" id="typeSelect" aria-label="Hotel type"><option value="">Hotel type</option><option value="Boutique" ${state.type==='Boutique'?'selected':''}>Boutique</option><option value="Resort" ${state.type==='Resort'?'selected':''}>Resort</option><option value="Design" ${state.type==='Design'?'selected':''}>Design hotel</option></select></div><button class="filterbtn" id="extraBtn">${I('sliders',15)} Filters ${state.stars||state.collab?'<span class="pill" style="padding:2px 5px">'+(Number(state.stars)+Number(state.collab))+'</span>':''}</button><button class="primary" id="searchBtn">Search ${I('arrow',15)}</button></section>${state.extra?`<div class="filter-extra"><label><input type="checkbox" id="starFilter" ${state.stars?'checked':''}/> 5-star classification only</label><label><input type="checkbox" id="collabFilter" ${state.collab?'checked':''}/> Confirmed collaboration observed</label><button class="secondary" id="clearExtra">Reset filters</button></div>`:''}${chips.length?`<div class="chipbar">${chips.map(([k,v])=>`<span class="chip">${escapeHtml(v)} <button data-remove="${k}" aria-label="Remove ${escapeHtml(v)}">×</button></span>`).join('')}<button class="text-btn" id="clearAll" style="margin-left:7px">Clear all</button></div>`:''}<div class="result-header"><div><strong>${a.length} ${a.length===1?'hotel':'hotels'} found</strong><span class="subtxt">Showing ${a.length} illustrative results</span></div><div class="order"><span>Sort by</span><select id="sortSelect" aria-label="Sort hotels"><option value="name" ${state.sort==='name'?'selected':''}>Name</option><option value="activity" ${state.sort==='activity'?'selected':''}>Creator activity</option><option value="response" ${state.sort==='response'?'selected':''}>Reply rate ${state.plan==='free'?'· Pro':''}</option><option value="fastest" ${state.sort==='fastest'?'selected':''}>Fastest reply ${state.plan==='free'?'· Pro':''}</option></select></div></div><div class="mobile-map-toggle"><button class="${!state.mobileMap?'active':''}" data-mobile-map="list">${I('list',14)} List</button><button class="${state.mobileMap?'active':''}" data-mobile-map="map">${I('map',14)} Map</button></div><div class="split ${state.mobileMap?'mobile-map':''}" id="discoverSplit"><div><div class="hotel-results">${a.length?a.map(hotelRow).join(''):`<div class="blank"><h3>No hotels match these filters</h3><p>Try a broader destination or remove some filters.</p><button class="secondary" id="clearEmpty">Clear filters</button></div>`}</div><div class="pagination"><span>Demo dataset · ${a.length} records</span><span>Page 1 of 1</span><button class="secondary" disabled>Next ${I('chevron',12)}</button></div></div>${drawMap(a)}</div><p class="demo-note">Concept prototype · Hotel names, imagery, creator activity and reply metrics are sample content, not from theugc.life catalog. Map is a schematic visualization, not Google Maps. In production, Discover uses 24 results per page with server-side pagination.</p>`}
function secTitle(id,name,extra=''){return `<div class="blocktitle"><h2 id="${id}">${name}</h2>${extra?`<small>${extra}</small>`:''}</div>`}
function metric(label,value,sub,locked=false,word=false){return `<div class="metric"><div class="metric-label">${escapeHtml(label)} <span title="Sample indicators follow confidence and anonymity rules">${I('info',12)}</span></div>${locked?`<div class="metric-locked"><span class="lock">${I('lock',13)}</span> Pro / Max</div><div class="metric-sub">See this hotel’s creator response insights.</div>`:`<div class="metric-value ${word?'words':''}">${escapeHtml(value||'Not enough data')}</div><div class="metric-sub">${escapeHtml(sub)}</div>`}</div>`}
function detail(){let h=hotels.find(x=>x.id===state.selected)||hotels[0];let paid=state.plan!=='free',max=state.plan==='max',saved=state.saved.has(h.id),unlocked=state.unlocked.has(h.id);let credits=state.credits[state.plan];let nextTitle=unlocked?'Ready to pitch?':'Start with the right contact';let nextText=unlocked?'Your example contact is ready. Create a tailored pitch or continue in Pipeline.':'Unlock the contact for this property to prepare a direct outreach.';let nextBtn=unlocked?'Create pitch · demo':'Unlock contact · 1 credit';return `<a href="#discover" class="back" id="goBack">${I('back',15)} Back to Discover <span class="muted">/</span> ${escapeHtml(h.city)}</a><div class="detail-head"><div><div class="eyebrow" style="margin-bottom:12px">HOTEL OPPORTUNITY</div><h1 class="detail-name">${escapeHtml(h.name)}</h1><p>${I('pin',15)} ${escapeHtml(h.district)}, ${escapeHtml(h.city)}, ${escapeHtml(h.country)} <span style="opacity:.5">·</span> ${escapeHtml(h.type)}</p><div class="detail-meta"><span class="stars">${'★'.repeat(h.stars)}</span><span>${h.stars}-star classification</span><span class="check">${I('check',13)} Editorial review · sample</span></div></div><div class="detail-quick-links"><button class="secondary" id="shareBtn">${I('share',14)} Share</button><button class="secondary" id="detailSave">${I(saved?'check':'bookmark',14)} ${saved?'Saved':'Save'}</button></div></div><div class="detail-top"><div class="hero-photo" role="img" aria-label="Illustrative architectural placeholder, not an actual hotel photo">${art(h.art)}<div class="hero-caption">${I('info',13)} Illustrative visual · verified photo pending</div></div><aside class="action-card"><span class="next-label">YOUR NEXT STEP</span><h3>${nextTitle}</h3><p>${nextText}</p><button class="primary" id="topAction">${nextBtn} ${I('arrow',16)}</button><div class="action-meta"><span>Current plan: <strong>${state.plan.toUpperCase()}</strong></span><span>${credits} credits available</span></div></aside></div><div class="dtabs" role="tablist" aria-label="Hotel sections"><button data-tab="overview" class="${state.activeTab==='overview'?'active':''}">Overview</button><button data-tab="intelligence" class="${state.activeTab==='intelligence'?'active':''}">Intelligence</button><button data-tab="contact" class="${state.activeTab==='contact'?'active':''}">Contact</button><button data-tab="work" class="${state.activeTab==='work'?'active':''}">My work</button></div><div class="detail-grid"><div class="mainstack"><section class="block" id="overview">${secTitle('overviewHeading','About this hotel')}<div class="panel panelpad"><div style="display:flex;gap:15px;flex-wrap:wrap;align-items:start;justify-content:space-between"><div><div class="eyebrow" style="margin-bottom:10px">PROPERTY</div><h3>${escapeHtml(h.name)}</h3><p style="color:var(--sub);font-size:12px;margin-top:6px">${escapeHtml(h.district)} · ${escapeHtml(h.city)} · ${escapeHtml(h.country)}</p></div><span class="pill">${h.stars}-star hotel</span></div><div class="subpanel">This is an illustrative hotel record. Production pages show only verified catalog information, available website/Instagram links and public map location.</div></div></section><section class="block" id="intelligence">${secTitle('intelligenceHeading','Creator intelligence','Confirmed signals, never a composite score')}<div class="panel"><div class="metric-grid">${metric('Creator activity',h.signal||'Not enough data',h.recency||'No qualifying public signal',false,true)}${metric('Reply rate',paid?(h.rate||'Not enough data'):'',paid&&h.rate?'Based on qualifying creator events · sample':'Available when enough data exists',!paid)}${metric('Typical reply time',paid?(h.reply||'Not enough data'):'',paid&&h.reply?'Reported as a time band · sample':'Available when enough data exists',!paid,true)}</div><div class="metric-footer"><span>${I('info',13)} Missing evidence never means 0% or poor performance.</span><button class="text-btn" id="methodBtn">How this works ${I('chevron',12)}</button></div></div>${!paid?`<div class="premium-note"><div class="mini-icon">${I('lock',17)}</div><p><b>Make decisions with better signals.</b>Pro and Max unlock confirmed response-rate and reply-time insights.</p><button class="secondary" id="upgradeBtn">Explore Pro ${I('arrow',13)}</button></div>`:''}<div class="stat-row" style="margin-top:14px"><div class="statitem"><strong>Creator collaborations</strong><p>${h.collab?'Collaboration observed from creator activity.':'Not enough evidence to disclose collaboration activity.'}</p></div><div class="statitem"><strong>Evidence recency</strong><p>${h.recency?`Activity reported: ${h.recency.toLowerCase()}.`:'No recency band currently available.'}</p></div></div>${paid?`<div class="panel panelpad" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3>Relevant to your experience</h3>${max?'<span class="pill">MAX DETAIL</span>':''}</div><p class="section-note" style="margin-top:9px">Creator Fit uses matching confirmed collaboration types. It is not an AI probability.</p><div style="margin-top:13px;display:flex;gap:7px;flex-wrap:wrap"><span class="pill">${h.fit?'Observed type: '+h.fit:'Not enough data for this property'}</span>${max&&h.fit?`<span class="pill">Confidence: ${h.confidence}</span><span class="pill">Freshness: ${h.recency||'Not disclosed'}</span>`:''}</div><div style="display:flex;gap:8px;margin-top:17px"><button class="secondary" id="pursueBtn">Pursue hotel</button><button class="text-btn" id="skipBtn">Skip</button></div></div>`:''}<button class="text-btn" id="rankBtn" style="margin-top:15px">${state.showRank?'Hide':'Compare'} hotels in this destination ${I('chevron',13)}</button>${state.showRank?`<div class="panel panelpad" style="margin-top:10px"><h3>Comparison · creator activity</h3><p class="section-note" style="margin:5px 0 15px">Single public metric · sample ranking</p>${hotels.filter(x=>x.city===h.city).slice(0,4).map((x,i)=>`<div class="rank-row"><span>${i+1}. <b>${escapeHtml(x.name)}</b></span><span>${escapeHtml(x.signal||'Not enough data')}</span></div>`).join('')}</div>`:''}</section><section class="block" id="contact">${secTitle('contactHeading','Hotel contact',unlocked?'Unlocked for your account':'Credit-based access')}<div class="panel panelpad"><div class="contact-row"><div class="contact-icon">${I('mail',20)}</div><div class="contact-content"><h3>${unlocked?'Partnerships team · example':'Find the right person to pitch'}</h3><p>${unlocked?'Sample contact for interaction demonstration only. No real hotel email has been retrieved.':'Unlocking a hotel contact requires 1 credit on every plan, including Pro and Max.'}</p></div></div>${unlocked?`<div class="subpanel" style="margin-top:18px"><span class="contact-mail">partnerships@example.com</span><p style="margin-top:5px">Example address · Not a real contact · No email is sent</p></div><div class="contact-actions"><button class="secondary" id="copyBtn">Copy example</button><button class="text-btn" id="reportBtn">Report incorrect contact</button></div>`:`<div class="contact-actions"><button class="primary" id="contactAction" ${credits<=0?'disabled':''}>${I('lock',15)} Unlock contact · 1 credit</button><span class="small muted">${credits} available</span></div><div class="subpanel">Demo unlock only. Production must use an authorized, verified contact provider and the server-side credit ledger.</div>`}</div></section><section class="block" id="work">${secTitle('workHeading','Your work with this hotel','Private to your account')}<div class="panel panelpad"><div style="display:flex;justify-content:space-between;align-items:center;gap:14px"><div><div class="eyebrow" style="margin-bottom:8px">RELATIONSHIP STATUS</div><h3>${saved?'Saved to Pipeline':'Not in your Pipeline'}</h3></div><span class="pill">${saved?'SAVED':'NOT STARTED'}</span></div><div class="timeline" style="margin-top:15px"><div class="timeitem"><span class="time-icon">${I('bookmark',13)}</span><div><b>${saved?'Hotel saved':'No outreach recorded yet'}</b><p>${saved?'Saved in this local prototype.':'Save this hotel to begin tracking your relationship.'}</p></div></div>${unlocked?`<div class="timeitem"><span class="time-icon">${I('check',13)}</span><div><b>Example contact unlocked</b><p>Demo only · no provider lookup or credit transaction.</p></div></div>`:''}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px"><button class="secondary" id="pipelineBtn">Open Pipeline ${I('arrow',13)}</button><button class="secondary" id="tripBtn">Add to trip ${I('arrow',13)}</button></div></div></section></div><aside class="aside-stack"><section class="panel panelpad"><div class="eyebrow" style="margin-bottom:11px">AT A GLANCE</div><div class="rank-row"><span>Destination</span><b>${escapeHtml(h.city)}</b></div><div class="rank-row"><span>Property type</span><b>${escapeHtml(h.type)}</b></div><div class="rank-row"><span>Classification</span><b>${h.stars}-star</b></div><div class="rank-row"><span>Creator activity</span><b>${h.signal?'Detected':'Not disclosed'}</b></div></section><section class="panel panelpad"><div style="display:flex;align-items:center;justify-content:space-between"><h3>Location</h3>${I('map',15)}</div><div style="height:178px;border-radius:8px;overflow:hidden;margin-top:14px;position:relative;background:var(--mapLand)">${mapArt()}<span class="map-pin current" style="left:53%;top:52%">1</span></div><p class="section-note" style="margin-top:10px">Illustrative map, not a geocoded location.</p></section><section class="panel panelpad"><div class="eyebrow" style="margin-bottom:10px">YOUR PLAN</div><h3>${state.plan.toUpperCase()} access</h3><p class="section-note" style="margin-top:6px">${state.plan==='free'?'Browse worldwide and use weekly credits. Premium response insights require Pro.':state.plan==='pro'?'Worldwide premium intelligence, AI drafting, and Pro credit allowance.':'Pro features plus advanced Creator Fit detail and expanded AI context.'}</p><button class="text-btn" id="planInfoBtn" style="margin-top:14px">Compare plans ${I('arrow',12)}</button></section></aside></div><p class="demo-note">Design-only prototype · All property names, contact information, geographic placement, photos and statistical values are illustrative. Actual production data must pass theugc.life publication, privacy and entitlement rules. No Gmail actions or purchases occur here.</p>`}
function render(){document.getElementById('main').innerHTML=state.view==='discover'?discover():detail();document.querySelectorAll('[data-plan]').forEach(b=>b.classList.toggle('active',b.dataset.plan===state.plan));document.getElementById('creditCount').textContent=state.credits[state.plan];document.getElementById('themeToggle').innerHTML=I(state.theme==='light'?'moon':'sun',17);document.documentElement.dataset.theme=state.theme;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',state.view==='discover'&&b.dataset.nav==='discover'));document.querySelectorAll('[data-mobile-nav]').forEach(b=>b.classList.toggle('active',state.view==='discover'&&b.dataset.mobileNav==='discover'));bind();}
function update(){render()}
function showHotel(id){state.selected=id;state.view='detail';state.activeTab='overview';state.showRank=false;history.replaceState(null,'','#hotel-'+id);update();window.scrollTo(0,0)}
function showDiscover(){state.view='discover';history.replaceState(null,'','#discover');update();window.scrollTo(0,0)}
function unlock(){let id=state.selected;if(state.unlocked.has(id))return toast('Already unlocked in this demo');if(state.credits[state.plan]<1)return toast('No credits available in this demo');state.credits[state.plan]--;state.unlocked.add(id);state.saved.add(id);toast('Demo contact unlocked · hotel saved');update();}
function bind(){let q=s=>document.querySelector(s);let many=(s,fn)=>document.querySelectorAll(s).forEach(fn);many('[data-open]',b=>b.addEventListener('click',e=>{e.preventDefault();showHotel(Number(b.dataset.open))}));many('[data-save]',b=>b.addEventListener('click',()=>{let id=Number(b.dataset.save);if(!state.saved.has(id)&&state.plan==='free'&&state.saved.size>=10)return toast('Free plan: 10 open relationships maximum');state.saved.has(id)?state.saved.delete(id):state.saved.add(id);toast(state.saved.has(id)?'Hotel saved to pipeline':'Removed from demo pipeline');update()}));many('[data-map-open]',b=>b.addEventListener('click',()=>{let h=hotels.find(x=>x.id===Number(b.dataset.mapOpen));let popup=q('#mapPopup');popup.innerHTML=`<div><strong>${escapeHtml(h.name)}</strong><p>${escapeHtml(h.city)} · ${escapeHtml(h.type)}</p></div><button class="secondary" data-pop-open="${h.id}">View ${I('arrow',12)}</button>`;popup.classList.remove('hide');many('[data-pop-open]',bb=>bb.addEventListener('click',()=>showHotel(Number(bb.dataset.popOpen))))}));many('[data-hover]',b=>{b.addEventListener('mouseenter',()=>{let p=q(`[data-map-open="${b.dataset.hover}"]`);if(p)p.classList.add('current')});b.addEventListener('mouseleave',()=>{let p=q(`[data-map-open="${b.dataset.hover}"]`);if(p)p.classList.remove('current')})});if(q('#searchInput')){q('#searchInput').addEventListener('input',e=>{state.search=e.target.value;let cursor=e.target.selectionStart;update();let el=q('#searchInput');el.focus();el.setSelectionRange(cursor,cursor)});q('#destinationSelect').addEventListener('change',e=>{state.destination=e.target.value;update()});q('#typeSelect').addEventListener('change',e=>{state.type=e.target.value;update()});q('#sortSelect').addEventListener('change',e=>{if(state.plan==='free'&&['response','fastest'].includes(e.target.value)){toast('Reply metrics are available on Pro and Max');state.sort='name'}else state.sort=e.target.value;update()});q('#extraBtn').addEventListener('click',()=>{state.extra=!state.extra;update()});q('#searchBtn')?.addEventListener('click',()=>{document.activeElement.blur();toast('Filters applied')});q('#starFilter')?.addEventListener('change',e=>{state.stars=e.target.checked;update()});q('#collabFilter')?.addEventListener('change',e=>{state.collab=e.target.checked;update()});q('#clearExtra')?.addEventListener('click',()=>{state.stars=false;state.collab=false;update()});q('#clearEmpty')?.addEventListener('click',clearFilters);q('#clearAll')?.addEventListener('click',clearFilters);many('[data-remove]',b=>b.addEventListener('click',()=>{let k=b.dataset.remove;if(k==='destination')state.destination='';if(k==='type')state.type='';if(k==='stars')state.stars=false;if(k==='collab')state.collab=false;update()}));many('[data-mobile-map]',b=>b.addEventListener('click',()=>{state.mobileMap=b.dataset.mobileMap==='map';update()}))}if(q('#goBack'))q('#goBack').addEventListener('click',e=>{e.preventDefault();showDiscover()});if(q('#topAction'))q('#topAction').addEventListener('click',()=>{state.unlocked.has(state.selected)?toast('Pitch editor exists in product; not included in this 2-page prototype'):unlock()});q('#contactAction')?.addEventListener('click',unlock);q('#detailSave')?.addEventListener('click',()=>{let id=state.selected;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);toast(state.saved.has(id)?'Hotel saved':'Removed from Pipeline');update()});many('[data-tab]',b=>b.addEventListener('click',()=>{state.activeTab=b.dataset.tab;many('[data-tab]',x=>x.classList.toggle('active',x.dataset.tab===state.activeTab));document.getElementById(b.dataset.tab)?.scrollIntoView({behavior:'smooth',block:'start'})}));q('#upgradeBtn')?.addEventListener('click',()=>toast('Preview Pro by selecting Pro at the top'));q('#planInfoBtn')?.addEventListener('click',()=>toast('Switch between Free, Pro and Max in the design preview bar'));q('#rankBtn')?.addEventListener('click',()=>{state.showRank=!state.showRank;update();document.getElementById('intelligence')?.scrollIntoView({block:'start'})});q('#methodBtn')?.addEventListener('click',()=>toast('Response rate: 15 confirmed pitches / 5 creators; reply time: 10 replies / 5 creators. Minimum 365-day window.'));q('#pursueBtn')?.addEventListener('click',()=>toast('Demo decision saved: pursue'));q('#skipBtn')?.addEventListener('click',()=>toast('Demo decision saved: skip'));q('#copyBtn')?.addEventListener('click',()=>{navigator.clipboard?.writeText('partnerships@example.com').then(()=>toast('Example email copied')).catch(()=>toast('Example: partnerships@example.com'))});q('#reportBtn')?.addEventListener('click',()=>toast('In production this opens Report contact'));q('#pipelineBtn')?.addEventListener('click',()=>toast('Pipeline exists in the product; this concept covers two pages'));q('#tripBtn')?.addEventListener('click',()=>toast('Trip picker exists in the product; not simulated here'));q('#shareBtn')?.addEventListener('click',()=>toast('Design preview · no public hotel sharing feature'));}
function clearFilters(){state.search='';state.destination='';state.type='';state.stars=false;state.collab=false;state.sort='name';update()}
document.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{state.plan=b.dataset.plan;state.sort=['response','fastest'].includes(state.sort)&&state.plan==='free'?'name':state.sort;toast('Previewing '+state.plan.toUpperCase()+' plan');render()}));document.getElementById('themeToggle').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';render()});document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();b.dataset.nav==='discover'?showDiscover():toast('This design study covers Discover and Hotel Detail')}));document.querySelectorAll('[data-mobile-nav]').forEach(b=>b.addEventListener('click',()=>b.dataset.mobileNav==='discover'?showDiscover():toast('This design study covers Discover and Hotel Detail')));document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();showDiscover()});if(location.hash.startsWith('#hotel-')){let n=Number(location.hash.replace('#hotel-',''));if(hotels.some(x=>x.id===n)){state.selected=n;state.view='detail'}}render();
</script>
</body></html>
