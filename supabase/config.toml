# Supabase local/project configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# This file lets `supabase` CLI reproduce the project locally and apply the
# versioned migrations in supabase/migrations. It does NOT contain secrets.
project_id = "theugc-life"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.migrations]
# Apply migrations in filename order (0001_, 0002_, ...).
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The deployed site URL; overridden per environment.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false
