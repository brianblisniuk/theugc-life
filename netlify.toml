[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "tests/**,e2e/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."gmail-send-dispatch"]
  schedule = "* * * * *"

[functions."gmail-inbox-sync"]
  schedule = "*/15 * * * *"

[functions."account-erasure"]
  schedule = "15 6 * * *"

[functions."credit-period-refresh"]
  schedule = "45 6 * * *"

[functions."gmail-followup-housekeeping"]
  schedule = "7,22,37,52 * * * *"
