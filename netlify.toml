[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "tests/**,e2e/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled jobs are prebundled into this directory by `npm run build`.
# `node_bundler` is set on each function, not globally, so the Next.js
# server function keeps Netlify's bundler. `server-only` is stubbed only
# in the prebundle. A scheduled function cannot also be a background
# function: that combination returns a bare 502 and writes no function log.
# These jobs stay synchronous. Netlify's scheduled limit is 30 seconds.

[functions]
  directory = "netlify/functions-built"

[functions."gmail-send-dispatch"]
  schedule = "* * * * *"
  node_bundler = "none"

[functions."gmail-inbox-sync"]
  schedule = "*/15 * * * *"
  node_bundler = "none"

[functions."account-erasure"]
  schedule = "15 6 * * *"
  node_bundler = "none"

[functions."credit-period-refresh"]
  schedule = "45 6 * * *"
  node_bundler = "none"

[functions."gmail-followup-housekeeping"]
  schedule = "7,22,37,52 * * * *"
  node_bundler = "none"
